[pytest]
# Every Fio test lives under one of these roots.  ``tests/`` is the unified
# suite; the plugin and player packages keep their own tests next to the code
# they ship with, because both are exported as self-contained packages.
testpaths =
    tests
    plugins
    player

norecursedirs = .git build dist *.egg-info __pycache__ assets maps

# Tier markers.  The default run is everything except ``benchmark`` (see
# tests/conftest.py); pick a single tier with ``-m``.
markers =
    qt: needs the desktop dependency set - PyQt5 and/or PyOpenGL importable. No
        display and no GPU: Qt runs against the offscreen platform plugin and
        PyOpenGL is only imported, never called. Everything unmarked runs on
        Python + NumPy + PyGLM alone.
    gl: needs a real OpenGL context (a GPU, or Mesa's software rasteriser under
        a virtual display). Skipped automatically when none can be created.
    integration: exercises several subsystems together
    perf: performance-regression guard - counts work done, not wall-clock time
    benchmark: reports timing measurements; opt-in via --run-benchmarks
    slow: takes more than a second

filterwarnings =
    ignore:Importing PyGLM via:PendingDeprecationWarning
    ignore:pkg_resources is deprecated:DeprecationWarning
