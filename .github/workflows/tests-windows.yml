name: Tests (Windows)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Keep CI focused on the latest commit for a branch, as tests.yml does.
concurrency:
  group: fio-tests-windows-${{ github.ref }}
  cancel-in-progress: true

# Windows tiers for the same suites tests.yml runs on Ubuntu. The desktop
# releases target x64 Windows and Windows on ARM, so both get the same
# treatment: the no-GPU fast core and the Qt suite, on native runners.
# Until now only the packaging was exercised on Windows (Native Windows
# ARM64 Build, FULL BUILD ALL PLATFORMS); no test tier ever ran there.
#
# All jobs start report-only (continue-on-error) so Windows-only findings
# surface on every push without blocking the branch. Once a job has been
# green across a release cycle, remove its continue-on-error line to promote
# it to a blocking tier.
jobs:
  windows_no_gpu:
    name: No-GPU fast core on Windows x64 (no Qt, CPython ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the oldest interpreter Fio runs on (python_runtime.py);
        # 3.14 is what the releases are built with.
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify GIL-enabled CPython baseline
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sys.implementation.name == "cpython"
          assert sys.version_info[:2] >= (3, 13)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") not in (1, "1")
          assert sys._is_gil_enabled()
          print(sys.version)
          PY
      - name: Install headless runtime baseline
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy==2.5.3" "PyGLM==2.8.3" "pygame-ce==2.5.8" "Pillow==11.3.0"
      - name: Run fast core tests that do not need Qt or a GPU
        shell: bash
        env:
          FIO_HEADLESS_TIER: '1'
        run: python -m pytest -m "not qt and not gl and not benchmark and not slow" -q

  windows_qt_no_gpu:
    name: Qt / no-GPU suite on Windows x64 (offscreen, shard ${{ matrix.shard }})
    runs-on: windows-latest
    # Measured on the 3.5.0.1611 run: the Qt suite is ~260 runner-minutes on
    # Windows and the shards are balanced by test count, not time. Four shards
    # needed 52-71 min (three hit the old 60-min limit); six are simulated at
    # 26-60 min from those timings, so the limit keeps ~25% headroom.
    # By 3.5.0's stable branch the slowest of six shards needed ~80 min and
    # was cancelled at the limit every run. Simulated from that run's module
    # timings, seven shards take 20-59 min (eight: up to 61, as count
    # balancing groups the slow modules), restoring the headroom.
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Run the complete Qt suite without a GPU or a display
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_qt_suite_shard.py --shard-count 7 --shard-index ${{ matrix.shard }}

  windows_arm64_no_gpu:
    name: No-GPU fast core on Windows ARM64 (native, CPython 3.14)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'arm64'
          cache: pip
      - name: Verify native ARM64 Python
        shell: pwsh
        run: |
          $proc = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          $machine = python -c "import platform; print(platform.machine().lower())"
          $bits = python -c "import struct; print(struct.calcsize('P') * 8)"
          Write-Host "Process architecture: $proc / machine: $machine / pointer size: $bits bits"
          if ($proc -ne 'Arm64' -or $machine -notmatch 'arm64|aarch64' -or $bits -ne '64') {
            throw "Python is not native 64-bit ARM64."
          }
      # Same runner image and toolchain search as the Native Windows ARM64
      # Build workflow: PyGLM/pygame-ce may compile from source on ARM64, so
      # the MSVC ARM64 environment must be on PATH before pip install.
      - name: Locate Visual Studio ARM64 toolchain
        shell: pwsh
        run: |
          $vswhere = (Get-Command 'vswhere.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $vswhere) {
            $vswhereCandidates = @()
            foreach ($base in @([Environment]::GetEnvironmentVariable('ProgramFiles(x86)'), $env:ProgramFiles)) {
              if ($base) {
                $vswhereCandidates += (Join-Path $base 'Microsoft Visual Studio\Installer\vswhere.exe')
              }
            }
            $vswhere = $vswhereCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          $vs = $null
          if ($vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          }
          if (-not $vs) {
            $vsCandidates = @(
              "$env:ProgramFiles\Microsoft Visual Studio\18\Enterprise",
              "$env:ProgramFiles\Microsoft Visual Studio\17\Enterprise"
            )
            $vs = $vsCandidates | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'VC\Auxiliary\Build\vcvarsall.bat')
            } | Select-Object -First 1
          }
          if (-not $vs) {
            throw "Visual Studio ARM64 C++ toolchain was not found."
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARM64 environment script: $vcvars"
      - name: Install headless runtime baseline (ARM64)
        shell: cmd
        run: |
          call "%VCVARS%" arm64
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy==2.5.3" "PyGLM==2.8.3" "pygame-ce==2.5.8" "Pillow==11.3.0"
      - name: Run fast core tests that do not need Qt or a GPU
        shell: bash
        env:
          FIO_HEADLESS_TIER: '1'
        run: python -m pytest -m "not qt and not gl and not benchmark and not slow" -q

  # The ARM64 runtime path end users get from "pip install -r
  # requirements.txt" resolves PyQt5 to the prebuilt PyQt5-WinARM64 wheel
  # (the marker in requirements.txt). The Native Windows ARM64 Build workflow
  # never exercises that path: it builds Qt and PyQt5 from source. This tier
  # installs dependencies exactly as an ARM64 user would, then runs the Qt
  # suite against the wheel.
  windows_arm64_qt_no_gpu:
    name: Qt / no-GPU suite on Windows ARM64 (offscreen, PyQt5-WinARM64 wheel, shard ${{ matrix.shard }})
    runs-on: windows-11-vs2026-arm
    # Same split as x64 (see there); ARM64 runners take a little longer.
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'arm64'
          cache: pip
      - name: Locate Visual Studio ARM64 toolchain
        shell: pwsh
        run: |
          $vswhere = (Get-Command 'vswhere.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $vswhere) {
            $vswhereCandidates = @()
            foreach ($base in @([Environment]::GetEnvironmentVariable('ProgramFiles(x86)'), $env:ProgramFiles)) {
              if ($base) {
                $vswhereCandidates += (Join-Path $base 'Microsoft Visual Studio\Installer\vswhere.exe')
              }
            }
            $vswhere = $vswhereCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          $vs = $null
          if ($vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          }
          if (-not $vs) {
            $vsCandidates = @(
              "$env:ProgramFiles\Microsoft Visual Studio\18\Enterprise",
              "$env:ProgramFiles\Microsoft Visual Studio\17\Enterprise"
            )
            $vs = $vsCandidates | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'VC\Auxiliary\Build\vcvarsall.bat')
            } | Select-Object -First 1
          }
          if (-not $vs) {
            throw "Visual Studio ARM64 C++ toolchain was not found."
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARM64 environment script: $vcvars"
      - name: Install dependencies as an ARM64 user would
        shell: cmd
        run: |
          call "%VCVARS%" arm64
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Verify the installed PyQt5 is native ARM64
        shell: pwsh
        run: |
          $report = python -c "import PyQt5.QtCore as m; print(m.QT_VERSION_STR); print(m.PYQT_VERSION_STR); import PyQt5.sip as s; print(s.__file__)"
          Write-Host $report
          $pyqtDir = python -c "import os, PyQt5; print(os.path.dirname(PyQt5.__file__))"
          $dll = Join-Path $pyqtDir 'Qt5\bin\Qt5Core.dll'
          if (-not (Test-Path -LiteralPath $dll)) { $dll = Join-Path $pyqtDir 'Qt\bin\Qt5Core.dll' }
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Qt5Core.dll not found under the installed PyQt5 package."
          }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Qt5Core.dll does not have a valid DOS/PE header."
          }
          $peOffset = [BitConverter]::ToUInt32($bytes, 0x3C)
          if ([uint64]$peOffset -gt [uint64]($bytes.Length - 6)) {
            throw "Qt5Core.dll PE header offset is outside the file."
          }
          $peOffset = [int]$peOffset
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw "Qt5Core.dll has an invalid PE signature."
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("Qt5Core.dll PE machine: 0x{0:X4} (0xAA64 = ARM64)" -f $machine)
          if ($machine -ne 0xAA64) {
            throw ("Qt5Core.dll is not ARM64: expected 0xAA64, found 0x{0:X4}." -f $machine)
          }
      - name: Run the complete Qt suite without a GPU or a display
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_qt_suite_shard.py --shard-count 6 --shard-index ${{ matrix.shard }}
