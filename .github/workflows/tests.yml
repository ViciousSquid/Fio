name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A failure in one optional graphical tier must not hide a failure in the core
# suite, so each tier is its own job and none of them depends on another.
jobs:
  headless:
    name: Core (headless, no Qt, no GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Verify CPython 3.14 GIL-enabled baseline
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sys.implementation.name == "cpython"
          assert sys.version_info >= (3, 14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") not in (1, "1")
          assert sys._is_gil_enabled()
          print(sys.version)
          print("Fio requires the normal GIL-enabled CPython baseline.")

      - name: Install the dependency-light half
        # No PyQt5 and no PyOpenGL: this job proves how much of Fio is testable
        # without the desktop dependency set at all.
        run: pip install pytest numpy PyGLM
      - name: Run the tests that need no Qt, no OpenGL, no display
        env:
          FIO_HEADLESS_TIER: '1'
        run: python -m pytest -m "not qt and not gl and not benchmark" -q

  editor:
    name: Editor + engine (Qt, offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Qt's platform-plugin libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx0 libopengl0 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Run everything that does not need a GPU
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest -m "not gl and not benchmark" -q

  opengl:
    name: Renderer (OpenGL, software rasteriser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Mesa and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx0 libopengl0 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Run the visual tier against llvmpipe
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m pytest -m gl -q

  benchmark:
    name: Renderer benchmark (reported, never fails on timing)
    runs-on: ubuntu-latest
    # Informational: a shared runner's speed is not a property of Fio.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Mesa and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx0 libopengl0 libgl1-mesa-dri libglx-mesa0 libegl1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt
      - name: Measure and report
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          FIO_BENCH_OUT: benchmark.json
        run: xvfb-run -a python -m pytest tests/performance/test_renderer_benchmark.py -m benchmark --run-benchmarks -q -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-benchmark
          path: benchmark.json
          if-no-files-found: ignore


  launch:
    name: Fio launch (CPython 3.14, Qt + software GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Qt/OpenGL runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             xvfb libgl1 libglx0 libopengl0 libgl1-mesa-dri libglx-mesa0 libegl1             libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0             libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Fio dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify CPython 3.14 GIL-enabled baseline
        run: |
          python - <<'PY'
          import sys
          import sysconfig

          assert sys.implementation.name == "cpython"
          assert sys.version_info >= (3, 14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") not in (1, "1")
          assert sys._is_gil_enabled()
          print(sys.version)
          PY
      - name: Launch Fio
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import time

          log_path = pathlib.Path("fio-launch.log")
          with log_path.open("w", encoding="utf-8") as log:
              proc = subprocess.Popen(
                  [sys.executable, "main.py"],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  env=os.environ.copy(),
              )
              try:
                  time.sleep(12)
                  returncode = proc.poll()
                  if returncode is not None:
                      raise SystemExit(
                          f"Fio exited during launch with code {returncode}.\n"
                          + log_path.read_text(encoding="utf-8")
                      )
                  print("Fio remained running for 12 seconds: launch succeeded.")
              finally:
                  if proc.poll() is None:
                      proc.terminate()
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait()
          PY
