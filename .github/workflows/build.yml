name: Nuitka Build and Validate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --output-filename=Fio `
            --assume-yes-for-downloads `
            --plugin-enable=pyqt5 `
            --include-qt-plugins=sensible,platforms,styles,imageformats `
            --include-package=engine `
            --include-package=editor `
            --include-package=PIL `
            --include-data-dir=assets=assets `
            --include-data-dir=cutscenes=cutscenes `
            --include-package=plugins `
            --include-package-data=plugins `
            --include-data-dir=tools=tools `
            --include-data-dir=maps=maps `
            --include-data-files=settings.ini=settings.ini `
            --include-data-files=editor/version.txt=editor/version.txt `
            --windows-icon-from-ico=assets/icon.ico `
            --windows-console-mode=disable `
            --output-dir=build `
            main.py

      - name: Validate executable exists
        shell: pwsh
        run: |
          if (Test-Path "build/main.dist/Fio.exe") {
            Write-Host "Build successful - Fio.exe found"
          } else {
            Write-Error "Build failed: Fio.exe not found"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fio-windows
          path: build/main.dist/


  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard imageio

      - name: Convert icon to .icns
        run: |
          mkdir -p build/icon.iconset

          # Convert ico to png first if needed
          if [ -f "assets/icon.ico" ]; then
            sips -s format png assets/icon.ico --out build/icon.png
          elif [ -f "assets/icon.png" ]; then
            cp assets/icon.png build/icon.png
          else
            echo "No icon file found!"
            exit 1
          fi

          # Generate all required sizes for .icns
          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $(($size*2)) $(($size*2)) build/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done

          # Create .icns file
          iconutil -c icns build/icon.iconset -o build/icon.icns

          # Also create a 1024x1024 version for high-res
          sips -z 1024 1024 build/icon.png --out build/icon_1024.png

      - name: Read Fio version
        run: |
          FIO_VERSION="$(sed -n 's/^version //p' editor/version.txt)"
          test -n "$FIO_VERSION"
          echo "FIO_VERSION=$FIO_VERSION" >> "$GITHUB_ENV"
          echo "Building Fio $FIO_VERSION"

      - name: Build with Nuitka (App Bundle)
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=Fio \
            --macos-app-version="$FIO_VERSION" \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-qt-plugins=sensible,platforms,imageformats \
            --include-package=engine \
            --include-package=plugins \
            --include-package-data=plugins \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=cutscenes=cutscenes \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --macos-app-icon=build/icon.icns \
            --macos-disable-console \
            --output-dir=build \
            main.py

      - name: Validate app bundle
        run: |
          if [ -f "build/main.app/Contents/MacOS/Fio" ]; then
            echo "App bundle OK"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/main.app/Contents/Info.plist" | grep -Fx "$FIO_VERSION"
          else
            echo "App bundle broken"
            exit 1
          fi

      - name: Inject Info.plist with proper icon configuration
        run: |
          plist_path="build/main.app/Contents/Info.plist"

          # Backup original plist
          cp "$plist_path" "$plist_path.bak"

          # Set CFBundleIconFile
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$plist_path" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile icon" "$plist_path"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string icon" "$plist_path"
          fi

          # Set CFBundleIconName
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$plist_path" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName icon" "$plist_path"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string icon" "$plist_path"
          fi

          # Ensure CFBundleIdentifier is set properly
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist_path" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.fio.editor" "$plist_path"
          fi

          echo "Info.plist configured:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$plist_path"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$plist_path"

      - name: Copy icon to bundle resources
        run: |
          # Copy icns to Resources folder with the name referenced in Info.plist
          cp build/icon.icns "build/main.app/Contents/Resources/icon.icns"

          # Also copy as AppIcon.icns (fallback for some macOS versions)
          cp build/icon.icns "build/main.app/Contents/Resources/AppIcon.icns"

          # Verify icon exists in Resources
          ls -la "build/main.app/Contents/Resources/" | grep icns

          echo "Icon files copied to bundle"

      - name: Create qt.conf for proper plugin paths
        run: |
          mkdir -p build/main.app/Contents/Resources

          cat > build/main.app/Contents/Resources/qt.conf << 'EOF'
          [Paths]
          Plugins = ../MacOS/PyQt5/Qt5/plugins
          EOF

          echo "qt.conf created"

      - name: Set executable permissions
        run: |
          chmod +x build/main.app/Contents/MacOS/Fio
          echo "Executable permissions set"

      - name: Ad-hoc code sign the app bundle
        run: |
          # Remove any quarantine attributes from the build
          xattr -cr build/main.app

          # Ad-hoc sign all binaries and the bundle itself
          # This prevents macOS Gatekeeper from reporting the app as "damaged"
          find build/main.app -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - build/main.app

          # Verify the signature
          codesign --verify --verbose build/main.app
          echo "Ad-hoc code signing complete"

      - name: Prepare app bundle for distribution
        run: |
          cd build

          # Rename to final app name
          mv main.app Fio.app

          # Use ditto to create the zip — it preserves macOS metadata and
          # resource forks that plain zip strips, avoiding Gatekeeper issues
          ditto -c -k --sequesterRsrc --keepParent Fio.app Fio-macOS.zip

          # Verify zip contents
          unzip -l Fio-macOS.zip | head -20

          cd ..

      - name: Verify icon in final bundle
        run: |
          # Check that icon exists in the renamed bundle
          if [ -f "build/Fio.app/Contents/Resources/icon.icns" ]; then
            echo "✓ Icon found in final bundle"
            file "build/Fio.app/Contents/Resources/icon.icns"
          else
            echo "✗ Icon missing from final bundle!"
            exit 1
          fi

          # Verify Info.plist still has icon settings after rename
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "build/Fio.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "build/Fio.app/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: fio-macos
          path: build/Fio-macOS.zip


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-xinerama0 libxcb-cursor0 libglib2.0-0 patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=Fio \
            --assume-yes-for-downloads \
            --plugin-enable=pyqt5 \
            --include-qt-plugins=sensible,platforms,imageformats \
            --include-package=engine \
            --include-package=plugins \
            --include-package-data=plugins \
            --include-package=editor \
            --include-package=PIL \
            --include-data-dir=assets=assets \
            --include-data-dir=cutscenes=cutscenes \
            --include-data-dir=tools=tools \
            --include-data-dir=maps=maps \
            --include-data-files=settings.ini=settings.ini \
            --include-data-files=editor/version.txt=editor/version.txt \
            --output-dir=build \
            main.py

      - name: Create desktop entry and icon for Linux
        run: |
          # Create a .desktop file
          mkdir -p build/main.dist/share/applications
          mkdir -p build/main.dist/share/icons/hicolor/256x256/apps

          # Copy icon if available
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png build/main.dist/share/icons/hicolor/256x256/apps/fio.png
          elif [ -f "assets/icon.ico" ]; then
            # Convert ico to png using ImageMagick or fallback
            convert assets/icon.ico build/main.dist/share/icons/hicolor/256x256/apps/fio.png || true
          fi

          # Create desktop entry
          cat > build/main.dist/fio.desktop << EOF
          [Desktop Entry]
          Name=Fio
          Comment=Fio Game Editor
          Exec=\$SELF/Fio
          Icon=fio
          Terminal=false
          Type=Application
          Categories=Development;IDE;
          EOF

          echo "Linux desktop integration prepared"

      - name: Validate executable exists
        run: |
          if [ -f "build/main.dist/Fio" ]; then
            echo "Build successful - Fio found"
          else
            echo "Build failed: executable not found"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fio-linux
          path: build/main.dist/


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-macos
      - build-linux

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: fio-windows
          path: release/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: fio-macos
          path: release/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: fio-linux
          path: release/linux

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          echo "Current branch: $BRANCH"

          # Every release branch must use:
          # X.X.X.XXXX_Latest
          if [[ "$BRANCH" != *_Latest ]]; then
            echo "ERROR: Release workflow must be run from a branch ending in _Latest."
            echo "Current branch: $BRANCH"
            exit 1
          fi

          # Remove the _Latest suffix.
          VERSION="${BRANCH%_Latest}"

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not determine release version from branch name."
            exit 1
          fi

          echo "Release version: $VERSION"

          # Ensure the version follows the expected:
          # X.X.X.XXXX
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Branch name does not match the expected format:"
            echo "       X.X.X.XXXX_Latest"
            echo "Actual: $BRANCH"
            exit 1
          fi

          mkdir -p release/assets

          # Package Windows build.
          echo "Packaging Windows..."
          (
            cd release/windows
            zip -r "../assets/Fio_${VERSION}_Windows.zip" .
          )

          # Package Linux build.
          echo "Packaging Linux..."
          (
            cd release/linux
            zip -r "../assets/Fio_${VERSION}_linux.zip" .
          )

          # macOS was already packaged with ditto by the macOS job.
          MAC_ZIP="$(find release/macos -type f -name 'Fio-macOS.zip' -print -quit)"

          if [[ -z "$MAC_ZIP" ]]; then
            echo "ERROR: Fio-macOS.zip not found."
            echo "Contents of release/macos:"
            find release/macos -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Packaging macOS..."
          cp "$MAC_ZIP" "release/assets/Fio_${VERSION}_macOS.zip"

          echo
          echo "Final release assets:"
          ls -lh release/assets

          # Export version for the next step.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating release $VERSION..."

          gh release create "$VERSION" \
            "release/assets/Fio_${VERSION}_Windows.zip" \
            "release/assets/Fio_${VERSION}_macOS.zip" \
            "release/assets/Fio_${VERSION}_linux.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fio $VERSION" \
            --generate-notes

          echo
          echo "Release created successfully:"
          echo "  Tag:    $VERSION"
          echo "  Title:  Fio $VERSION"
          echo
          echo "Assets:"
          ls -lh release/assets
