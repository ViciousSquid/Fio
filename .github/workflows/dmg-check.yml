name: macOS DMG check (temporary)

on:
  push:
    branches: ["claude/confident-thompson-dmrdpg"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install "Pillow==11.3.0"
      - name: Stand-in Fio.app with the real icon
        run: |
          mkdir -p build/icon.iconset build/Fio.app/Contents/MacOS build/Fio.app/Contents/Resources
          sips -s format png assets/icon.ico --out build/icon.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) build/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/icon.iconset -o build/Fio.app/Contents/Resources/icon.icns
          printf '#!/bin/sh\n' > build/Fio.app/Contents/MacOS/Fio; chmod +x build/Fio.app/Contents/MacOS/Fio
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Fio" -c "Add :CFBundleName string Fio" \
            -c "Add :CFBundleIconFile string icon" -c "Add :CFBundlePackageType string APPL" build/Fio.app/Contents/Info.plist
      - name: Build installer disk image (as in build.yml)
        run: |
          pip install "dmgbuild==1.6.7"
          python .github/macos-dmg/make_background.py build/dmg-background
          tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png \
            -out build/dmg-background.tiff
          dmgbuild -s .github/macos-dmg/dmg_settings.py \
            -D app=build/Fio.app -D background=build/dmg-background.tiff \
            "Fio" build/Fio-macOS.dmg
          hdiutil verify build/Fio-macOS.dmg
      - name: Open it in Finder and capture the window
        run: |
          hdiutil attach build/Fio-macOS.dmg
          ls -la /Volumes/Fio /Volumes/Fio/.background 2>/dev/null || ls -la /Volumes/Fio
          open /Volumes/Fio
          sleep 8
          screencapture -x shot.png
          python - <<'PY'
          import base64, io
          from PIL import Image
          im = Image.open('shot.png').convert('RGB')
          s = im.width / 1024
          im = im.crop((int(150 * s), int(60 * s), int(910 * s), int(600 * s)))
          im = im.resize((760, 540))
          buf = io.BytesIO(); im.save(buf, 'JPEG', quality=80)
          data = base64.b64encode(buf.getvalue()).decode()
          print('SHOT-BEGIN')
          for i in range(0, len(data), 1000):
              print('SHOT ' + data[i:i + 1000])
          print('SHOT-END', len(data))
          PY
