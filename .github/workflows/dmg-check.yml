name: macOS DMG check (temporary)

on:
  push:
    branches: ["claude/confident-thompson-dmrdpg"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install "Pillow==11.3.0"
      - name: Stand-in Fio.app with the real icon
        run: |
          mkdir -p build/icon.iconset build/Fio.app/Contents/MacOS build/Fio.app/Contents/Resources
          sips -s format png assets/icon.ico --out build/icon.png
          for size in 16 32 64 128 256 512; do
            sips -z $size $size build/icon.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) build/icon.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/icon.iconset -o build/Fio.app/Contents/Resources/icon.icns
          printf '#!/bin/sh\n' > build/Fio.app/Contents/MacOS/Fio; chmod +x build/Fio.app/Contents/MacOS/Fio
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Fio" -c "Add :CFBundleName string Fio" \
            -c "Add :CFBundleIconFile string icon" -c "Add :CFBundlePackageType string APPL" build/Fio.app/Contents/Info.plist
      - name: Build installer disk image (as in build.yml)
        run: |
          pip install "dmgbuild==1.6.7"
          python .github/macos-dmg/make_background.py build/dmg-background
          tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png \
            -out build/dmg-background.tiff
          dmgbuild -s .github/macos-dmg/dmg_settings.py \
            -D app=build/Fio.app -D background=build/dmg-background.tiff \
            "Fio" build/Fio-macOS.dmg
          hdiutil verify build/Fio-macOS.dmg
      - name: Open it in Finder, in Light and then Dark mode
        run: |
          cat > grab.py <<'PY'
          import sys
          sys.path.insert(0, '.github/macos-dmg')
          from PIL import Image
          import make_background as m
          im = Image.open(sys.argv[1]).convert('RGB')
          tag = sys.argv[2]
          s = round(im.width / 1024)      # Retina capture -> 2
          bg = m.BACKGROUND
          px = im.load()
          near = lambda c, t, d=4: all(abs(a - b) <= d for a, b in zip(c, t))
          xs, ys = [], []
          for y in range(0, im.height, 2):
              for x in range(0, im.width, 2):
                  if near(px[x, y], bg):
                      xs.append(x); ys.append(y)
          if not xs:
              print(f'{tag}: DMG background not found on screen'); sys.exit(0)
          left, top, right, bottom = min(xs), min(ys), max(xs), max(ys)
          print(f'{tag}: DMG window content at {left},{top}..{right},{bottom} ({(right-left)//s}x{(bottom-top)//s} pt)')
          print(f'{tag}: title bar colour {px[left + 40*s, max(0, top - 12*s)]}')
          for name, (cx, cy) in (('Fio label', m.APP_AT), ('Applications label', m.APPS_AT)):
              box = (left + (cx - 70) * s, top + (cy + 66) * s, left + (cx + 70) * s, top + (cy + 92) * s)
              text = [c for c in im.crop(box).getdata() if not near(c, bg, 40)]
              if not text:
                  print(f'{tag}: {name}: no text found'); continue
              text.sort(key=m._luminance)
              darkest, lightest = text[0], text[-1]
              ink = darkest if m.contrast(darkest, bg) > m.contrast(lightest, bg) else lightest
              print(f'{tag}: {name}: {len(text)} text pixels, ink {ink}, contrast {m.contrast(ink, bg):.2f}:1')
          PY
          set_dark() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" \
              || defaults write -g AppleInterfaceStyle Dark
            echo "AppleInterfaceStyle: $(defaults read -g AppleInterfaceStyle 2>/dev/null || echo Light)"
          }
          set_dark false || true
          hdiutil attach build/Fio-macOS.dmg
          ls -la /Volumes/Fio
          open /Volumes/Fio; sleep 8
          screencapture -x light.png; python grab.py light.png light
          osascript -e 'tell application "Finder" to close every window' || true
          set_dark true
          killall Finder || true; sleep 4
          open /Volumes/Fio; sleep 8
          screencapture -x dark.png; python grab.py dark.png dark
