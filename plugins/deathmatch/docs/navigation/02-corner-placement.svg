<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="608" viewBox="0 0 1120 608" role="img" aria-labelledby="title desc">
<title id="title">Corners: clear centres are not enough</title><desc id="desc">Leave a body-sized corridor around every wall edge.</desc>
<defs><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f82"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bd493e"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="608" rx="18" fill="#f5f3ec" stroke="none" /><text x="32" y="43" font-size="27" fill="#173047" font-weight="700" text-anchor="start">Corners: clear centres are not enough</text><text x="32" y="75" font-size="17" fill="#536778" font-weight="400" text-anchor="start">Leave a body-sized corridor around every wall edge.</text><rect x="32" y="108" width="512" height="426" rx="12" fill="white" stroke="#dce1df" /><text x="54" y="145" font-size="22" fill="#bd493e" font-weight="700" text-anchor="start">Too close to the corner</text><rect x="78" y="276" width="270" height="50" rx="3" fill="#cbd2d5" stroke="none" /><text x="213" y="307" font-size="17" fill="#536778" font-weight="600" text-anchor="middle">SOLID WALL</text><circle cx="164" cy="447" r="17" fill="#173047"/><text x="164" y="453" font-size="17" fill="white" font-weight="700" text-anchor="middle">B</text><text x="133" y="485" font-size="16" fill="#536778" font-weight="400" text-anchor="start">Bot</text><circle cx="164" cy="193" r="17" fill="#173047"/><text x="164" y="199" font-size="17" fill="white" font-weight="700" text-anchor="middle">G</text><text x="133" y="163" font-size="16" fill="#536778" font-weight="400" text-anchor="start">Goal</text><path d="M164,447 L364,301" fill="none" stroke="#bd493e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M364,301 L164,193" fill="none" stroke="#bd493e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="339" y="276" width="50" height="50" rx="2" fill="#f6d7cf" stroke="#bd493e" fill-opacity="0.7"/><circle cx="364" cy="301" r="11" fill="white" stroke="#bd493e" stroke-width="4"/><text x="272" y="383" font-size="17" fill="#bd493e" font-weight="400" text-anchor="start">The centre is outside;</text><text x="272" y="408" font-size="17" fill="#bd493e" font-weight="400" text-anchor="start">the body still clips.</text><rect x="576" y="108" width="512" height="426" rx="12" fill="white" stroke="#dce1df" /><text x="598" y="145" font-size="22" fill="#087f82" font-weight="700" text-anchor="start">Room for the whole body</text><rect x="622" y="276" width="270" height="50" rx="3" fill="#cbd2d5" stroke="none" /><text x="757" y="307" font-size="17" fill="#536778" font-weight="600" text-anchor="middle">SOLID WALL</text><circle cx="708" cy="447" r="17" fill="#173047"/><text x="708" y="453" font-size="17" fill="white" font-weight="700" text-anchor="middle">B</text><text x="677" y="485" font-size="16" fill="#536778" font-weight="400" text-anchor="start">Bot</text><circle cx="708" cy="193" r="17" fill="#173047"/><text x="708" y="199" font-size="17" fill="white" font-weight="700" text-anchor="middle">G</text><text x="677" y="163" font-size="16" fill="#536778" font-weight="400" text-anchor="start">Goal</text><path d="M729,447 L968,447" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M986,429 L986,217" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M968,193 L733,193" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><rect x="961" y="276" width="50" height="50" rx="2" fill="#d2ece7" stroke="#087f82" fill-opacity="0.6"/><circle cx="986" cy="447" r="11" fill="white" stroke="#087f82" stroke-width="4"/><text x="986" y="486" font-size="17" fill="#087f82" font-weight="600" text-anchor="middle">Approach</text><circle cx="986" cy="193" r="11" fill="white" stroke="#087f82" stroke-width="4"/><text x="986" y="164" font-size="17" fill="#087f82" font-weight="600" text-anchor="middle">Exit</text><path d="M896,348 L959,348" fill="none" stroke="#536778" stroke-width="2" stroke-linecap="round"/><text x="946" y="379" font-size="16" fill="#536778" font-weight="400" text-anchor="middle">clearance</text><text x="32" y="575" font-size="19" fill="#173047" font-weight="600" text-anchor="start">Top-down view. Check the complete link, not just the two node positions.</text></g></svg>