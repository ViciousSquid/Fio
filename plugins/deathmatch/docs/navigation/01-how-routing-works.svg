<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">How Fio chooses and follows a route</title><desc id="desc">Goal selection, route planning and physical movement are separate jobs.</desc>
<defs><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f82"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bd493e"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="520" rx="18" fill="#f5f3ec" stroke="none" /><text x="32" y="43" font-size="27" fill="#173047" font-weight="700" text-anchor="start">How Fio chooses and follows a route</text><text x="32" y="75" font-size="17" fill="#536778" font-weight="400" text-anchor="start">Goal selection, route planning and physical movement are separate jobs.</text><rect x="32" y="120" width="280" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="50" y="157" font-size="21" fill="#173047" font-weight="700" text-anchor="start">Choose a goal</text><text x="50" y="192" font-size="15" fill="#536778" font-weight="400" text-anchor="start">Pickup · objective · investigate</text><rect x="392" y="120" width="330" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="410" y="157" font-size="21" fill="#173047" font-weight="700" text-anchor="start">Direct walk supported?</text><text x="410" y="192" font-size="15" fill="#536778" font-weight="400" text-anchor="start">Check body, floor and live doors</text><rect x="802" y="120" width="286" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="820" y="157" font-size="21" fill="#173047" font-weight="700" text-anchor="start">Follow the goal</text><text x="820" y="192" font-size="15" fill="#536778" font-weight="400" text-anchor="start">Nodes may be bypassed</text><rect x="392" y="325" width="330" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="410" y="362" font-size="21" fill="#173047" font-weight="700" text-anchor="start">Search linked nodes</text><text x="410" y="397" font-size="15" fill="#536778" font-weight="400" text-anchor="start">A* + floors, doors and platforms</text><rect x="802" y="325" width="286" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="820" y="362" font-size="21" fill="#173047" font-weight="700" text-anchor="start">Follow route points</text><text x="820" y="397" font-size="15" fill="#536778" font-weight="400" text-anchor="start">Player physics moves the bot</text><rect x="32" y="325" width="280" height="104" rx="12" fill="white" stroke="#dce1df" /><text x="50" y="362" font-size="21" fill="#173047" font-weight="700" text-anchor="start">No usable route</text><text x="50" y="397" font-size="15" fill="#536778" font-weight="400" text-anchor="start">Reconsider · stuck recovery</text><path d="M314,172 L377,172" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M724,172 L786,172" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><text x="754" y="153" font-size="16" fill="#087f82" font-weight="400" text-anchor="middle">yes</text><path d="M556,228 L556,307" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><text x="578" y="275" font-size="16" fill="#087f82" font-weight="400" text-anchor="start">no</text><path d="M724,377 L786,377" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)"/><text x="755" y="357" font-size="15" fill="#087f82" font-weight="400" text-anchor="middle">route</text><path d="M390,377 L328,377" fill="none" stroke="#bd493e" stroke-width="4" stroke-linecap="round" marker-end="url(#red-arrow)"/><text x="358" y="357" font-size="15" fill="#bd493e" font-weight="400" text-anchor="middle">none</text><text x="32" y="487" font-size="19" fill="#173047" font-weight="600" text-anchor="start">Check live geometry and floor support. Platform routes include boarding, riding and leaving.</text></g></svg>