<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="664" viewBox="0 0 1120 664" role="img" aria-labelledby="title desc">
<title id="title">Doors and platforms: links depend on the live world</title><desc id="desc">Teal diamonds: Bot Navigation Nodes. Gold squares: the mover’s ordinary PathNodes.</desc>
