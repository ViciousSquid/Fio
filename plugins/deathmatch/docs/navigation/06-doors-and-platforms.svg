"32" y="589" font-size="18" fill="#087f82" font-weight="700" text-anchor="start">Approach</text><text x="237" y="589" font-size="18" fill="#087f82" font-weight="700" text-anchor="start">Wait</text><text x="440" y="589" font-size="18" fill="#087f82" font-weight="700" text-anchor="start">Board</text><text x="642" y="589" font-size="18" fill="#087f82" font-weight="700" text-anchor="start">Ride</text><text x="863" y="589" font-size="18" fill="#087f82" font-weight="700" text-anchor="start">Exit</text><path d="M160,582 L212,582" fill="none" stroke="#087f82" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M357,582 L409,582" fill="none" stroke="#087f82" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M557,582 L609,582" fill="none" stroke="#087f82" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M760,582 L812,582" fill="none" stroke="#087f82" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><text x="32" y="632" font-size="17" fill="#536778" font-weight="400" text-anchor="start">Leave only when the current platform position gives a supported, body-clear walk to the landing.</text></g></svg>