<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="524" viewBox="0 0 1120 524" role="img" aria-labelledby="title desc">
<title id="title">Height, headroom and gaps</title><desc id="desc">The current planner checks obstacle clearance, not continuous ground support.</desc>
<defs><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f82"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bd493e"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1120" height="524" rx="18" fill="#f5f3ec" stroke="none" /><text x="32" y="43" font-size="27" fill="#173047" font-weight="700" text-anchor="start">Height, headroom and gaps</text><text x="32" y="75" font-size="17" fill="#536778" font-weight="400" text-anchor="start">The current planner checks obstacle clearance, not continuous ground support.</text><rect x="32" y="108" width="512" height="343" rx="12" fill="white" stroke="#dce1df" /><text x="54" y="145" font-size="21" fill="#087f82" font-weight="700" text-anchor="start">Eye-height markers work</text><rect x="576" y="108" width="512" height="343" rx="12" fill="white" stroke="#dce1df" /><text x="598" y="145" font-size="21" fill="#bd493e" font-weight="700" text-anchor="start">A clear line can still be unsafe</text><rect x="70" y="180" width="435" height="22" rx="2" fill="#cbd2d5" stroke="none" /><text x="287" y="176" font-size="15" fill="#536778" font-weight="400" text-anchor="middle">ceiling</text><rect x="70" y="353" width="435" height="35" rx="2" fill="#cbd2d5" stroke="none" /><text x="287" y="417" font-size="17" fill="#536778" font-weight="400" text-anchor="middle">continuous supporting floor</text><rect x="216" y="237" width="54" height="116" rx="2" fill="#d2ece7" stroke="#087f82" fill-opacity="0.6"/><path d="M243,260 L243,353" fill="none" stroke="#087f82" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="243" cy="260" r="11" fill="white" stroke="#087f82" stroke-width="4"/><text x="323" y="259" font-size="17" fill="#087f82" font-weight="600" text-anchor="middle">Marker</text><path d="M156,353 L330,353" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round"/><text x="322" y="317" font-size="17" fill="#087f82" font-weight="400" text-anchor="start">Arrival radius</text><text x="243" y="398" font-size="17" fill="#087f82" font-weight="400" text-anchor="middle">Walking surface</text><text x="84" y="234" font-size="16" fill="#536778" font-weight="400" text-anchor="start">Allow</text><text x="84" y="258" font-size="16" fill="#536778" font-weight="400" text-anchor="start">headroom</text><rect x="614" y="353" width="149" height="35" rx="2" fill="#cbd2d5" stroke="none" /><rect x="885" y="353" width="165" height="35" rx="2" fill="#cbd2d5" stroke="none" /><circle cx="697" cy="353" r="11" fill="white" stroke="#bd493e" stroke-width="4"/><text x="697" y="393" font-size="17" fill="#bd493e" font-weight="600" text-anchor="middle">A</text><circle cx="969" cy="353" r="11" fill="white" stroke="#bd493e" stroke-width="4"/><text x="969" y="393" font-size="17" fill="#bd493e" font-weight="600" text-anchor="middle">B</text><path d="M716,353 L946,353" fill="none" stroke="#bd493e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#red-arrow)"/><text x="824" y="290" font-size="18" fill="#bd493e" font-weight="600" text-anchor="middle">No floor beneath</text><text x="824" y="317" font-size="17" fill="#bd493e" font-weight="400" text-anchor="middle">the middle of this link</text><text x="824" y="429" font-size="17" fill="#bd493e" font-weight="600" text-anchor="middle">Do not author this connection.</text><text x="32" y="491" font-size="18" fill="#173047" font-weight="600" text-anchor="start">Side view. Walk each segment in both directions; a bidirectional link cannot encode a one-way drop.</text></g></svg>